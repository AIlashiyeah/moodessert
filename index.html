<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moodessert</title>
<meta name="description" content="Tell us your MBTI and star sign, answer five odd questions, and watch your answers bake into the dessert you are.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column, one screen at a time, like a phone-sized pastry box */
:root{
  --bg:#F4ECE1; --surface:#FBF6EF; --ink:#2A1D17; --muted:#77695E;
  --accent:#C2185B; --accent-ink:#FFFFFF; --line:#E2D6C7; --chip:#F3E3E6;
  --display:"Bricolage Grotesque","Noto Sans SC",system-ui,sans-serif;
  --body:"Inter","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141010; --surface:#1E1917; --ink:#F3ECE6; --muted:#A89B92;
  --accent:#FF6F9C; --accent-ink:#1A0F0B; --line:#3A302B; --chip:#33232A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141010; --surface:#1E1917; --ink:#F3ECE6; --muted:#A89B92;
  --accent:#FF6F9C; --accent-ink:#1A0F0B; --line:#3A302B; --chip:#33232A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;padding-block:16px 4px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.note{font-size:12px;color:var(--muted);text-align:center}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,46px);line-height:1.04;letter-spacing:-.02em;margin:8px 0 0;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:clamp(23px,6.6vw,29px);line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
.lede{color:var(--muted);font-size:17px;max-width:38ch}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-weight:600;padding:15px 20px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,.mbti button:focus-visible,.lang button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:default}
.stack{display:flex;flex-direction:column;gap:10px}
.facts{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.facts b{color:var(--ink);font-variant-numeric:tabular-nums}
.mbti{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mbti button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:14px 0;border-radius:12px;border:1.5px solid var(--line);font-family:var(--display);font-weight:800;font-size:15px;background:var(--surface)}
.mbti button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.progress{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:16px 18px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-size:16px;font-weight:500;line-height:1.45;transition:opacity .25s,border-color .15s}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--chip)}
.opt[disabled]{cursor:default}
.opt[disabled]:not([aria-pressed="true"]){opacity:.38}
.opt.own{border-style:dashed;color:var(--muted)}
.ownf{display:flex;gap:8px}
.ownf input{flex:1;min-width:0;padding:14px 16px;border-radius:14px;border:1.5px solid var(--accent);background:var(--surface);color:var(--ink);font:inherit}
.ownf .btn{padding:14px 18px;white-space:nowrap}
.signs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.signs button,.wide{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:14px 6px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:15px;background:var(--surface)}
.signs button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.wide{border-style:dashed;color:var(--muted)}
.signs button:focus-visible,.wide:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.signs button:hover,.wide:hover{border-color:var(--accent)}
.boost{font-size:14px;color:var(--muted)}
.twist{padding:14px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:500}
.hint{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden}
#stage{width:100%;aspect-ratio:1/1}
.card .body{padding:4px 20px 22px;display:flex;flex-direction:column;gap:12px}
.type{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;padding:4px 10px;border-radius:999px;background:var(--ink);color:var(--bg)}
.rare{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.chips span.hot{border-color:transparent;background:var(--chip);color:var(--accent)}
.praise{font-size:19px;font-weight:600;line-height:1.45;text-wrap:pretty}
.callout{padding:12px 14px;border-radius:14px;background:var(--chip);font-size:15px}
.callout small{display:block;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:2px}
.rare{font-size:13px;color:var(--muted)}
.oven{display:flex;flex-direction:column;align-items:center;gap:16px;padding:64px 0}
.dots{display:flex;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:rise 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes rise{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-8px);opacity:1}}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.dots i{animation:none}.bar i,.opt{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Moo<span>dessert</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-zh" aria-pressed="false">中文</button>
    </div>
  </header>
  <main id="app" class="stack" aria-live="polite"></main>
  <p class="note" id="note"></p>
</div>

<script type="module">
import { bakeDessert } from "./bake.js";

const T = {
  en: { note: "GenHacks Open 2026 entry. Made for fun: a reading of five answers, not a psychological assessment.",
    title: "Which dessert are you?", lede: "Answer five odd little questions. We read what your choices say about you, and bake it into a dessert.",
    f1: "questions", f2: "desserts", f3: "flavours", start: "Start",
    mbtiQ: "First ingredient: your MBTI", mbtiHint: "It only picks the cake base. It won't appear on your card.", noMbti: "Never took the test", next: "Next",
    guessHint: "No problem. Four quick taps and we'll find your dessert.",
    signQ: "Second ingredient: your star sign", signHint: "It decides the texture of your dessert.", skip: "Skip",
    own: "None of these. I'll write my own", ownPh: "What would you actually do?", ownOk: "That's me",
    baking: "Preheating the oven…", flavour: "flavour", drive: "What drives you", pull: "Your contradiction", also: (f, n) => `Mostly this, with a streak of ${f}: ${n}.`,
    share: "Send to a friend", copied: "Link copied. Send it to a friend.", copyFail: "Copy the link from your address bar.", again: "Try another flavour",
    shareText: (f, d, b) => `I'm a ${f} ${d}: ${b}. Which dessert are you?`, loadFail: "Couldn't load the quiz. Refresh to try again." },
  zh: { note: "GenHacks Open 2026 参赛作品。图个开心：这是对五个回答的解读，不是心理测评。",
    title: "你是哪块甜点？", lede: "答五道有点怪的小题，我们读出你的选择背后在乎什么，再把它烤成一块甜点。",
    f1: "道题", f2: "种甜点", f3: "种口味", start: "开始",
    mbtiQ: "第一样原料：你的 MBTI", mbtiHint: "只用来挑蛋糕胚，不会出现在结果卡上。", noMbti: "我没测过", next: "下一题",
    guessHint: "没关系，点四下，我们帮你找到你的甜点。",
    signQ: "第二样原料：你的星座", signHint: "它决定这块甜点的口感。", skip: "跳过",
    own: "都不像我，我自己写一句", ownPh: "换成你，你会怎么做？", ownOk: "就这个",
    baking: "烤箱预热中…", flavour: "口味", drive: "你在乎的", pull: "你的反差", also: (f, n) => `主味之外，你还藏着一点${f}：${n}。`,
    share: "发给朋友测一测", copied: "链接已复制，发给朋友吧。", copyFail: "请从地址栏复制链接。", again: "换个口味再测",
    shareText: (f, d, b) => `我是一块${f}${d}：${b}。你是哪块甜点？`, loadFail: "题库没加载出来，刷新再试一次。" },
};
const TYPES = ["INTJ", "INTP", "ENTJ", "ENTP", "INFJ", "INFP", "ENFJ", "ENFP", "ISTJ", "ISFJ", "ESTJ", "ESFJ", "ISTP", "ISFP", "ESTP", "ESFP"];
// For people who never took the MBTI: one everyday habit per axis, two answers each.
const GUESS = [
  { q: { zh: "一个很累的周五晚上，你更想", en: "A long Friday is finally over. You'd rather" },
    a: [["E", { zh: "找人出去，见到人就回血了", en: "Go out. Seeing people recharges you" }], ["I", { zh: "谁也别找我，我要一个人待着", en: "Be left alone. Nobody call you" }]] },
  { q: { zh: "别人给你讲一件事，你更在意", en: "Someone tells you a story. You care more about" },
    a: [["S", { zh: "具体发生了什么，细节要对得上", en: "What exactly happened. The details have to add up" }], ["N", { zh: "这件事背后说明了什么", en: "What it means underneath" }]] },
  { q: { zh: "朋友来找你吐槽，你的第一反应", en: "A friend comes to you to vent. Your first move" },
    a: [["T", { zh: "帮他分析问题到底出在哪", en: "Work out where the problem really is" }], ["F", { zh: "先站他这边，陪他骂两句", en: "Take their side first and grumble along" }]] },
  { q: { zh: "出门旅行，你是", en: "On a trip, you are" },
    a: [["J", { zh: "行程提前排好，心里才踏实", en: "Calm only once the plan is set in advance" }], ["P", { zh: "到了再说，走到哪算哪", en: "Deciding when you get there" }]] },
];
const SIGNS = [
  ["aries", "Aries", "白羊座", "3.21–4.19", "the spark that gets things started", "说干就干的那股冲劲"],
  ["taurus", "Taurus", "金牛座", "4.20–5.20", "a steadiness that never lets go", "认准了就不松手的稳"],
  ["gemini", "Gemini", "双子座", "5.21–6.21", "a mind quicker than the room", "比谁都转得快的脑子"],
  ["cancer", "Cancer", "巨蟹座", "6.22–7.22", "the care that keeps people close", "把人放在心上的细腻"],
  ["leo", "Leo", "狮子座", "7.23–8.22", "a light people notice when you walk in", "一出场就亮起来的光"],
  ["virgo", "Virgo", "处女座", "8.23–9.22", "an eye for the detail others miss", "别人看不到的那份讲究"],
  ["libra", "Libra", "天秤座", "9.23–10.23", "the grace that puts everyone at ease", "让谁都舒服的分寸感"],
  ["scorpio", "Scorpio", "天蝎座", "10.24–11.22", "seeing straight through, and keeping it safe", "看得透，也守得住"],
  ["sagittarius", "Sagittarius", "射手座", "11.23–12.21", "the freedom to just go", "说走就走的自由"],
  ["capricorn", "Capricorn", "摩羯座", "12.22–1.19", "the grit to see it through", "咬着牙也要做成的韧劲"],
  ["aquarius", "Aquarius", "水瓶座", "1.20–2.18", "a way of thinking nobody else has", "跟谁都不一样的脑回路"],
  ["pisces", "Pisces", "双鱼座", "2.19–3.20", "one more layer of tenderness and imagination", "比别人多一层的温柔和想象"],
];
let lang = (navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en";
let QUIZ = null, st = { screen: "home" }, oven = null, timer = 0;
const app = document.getElementById("app"), $ = (id) => document.getElementById(id);
const t = (k) => T[lang][k];
const L = (o) => o[lang] || o.en;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const lowEnd = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 4;
const signOf = (id) => SIGNS.find((s) => s[0] === id);
const TEXTURES = [{ zh: "焦香脆顶", en: "crisp, caramelised top" }, { zh: "扎实绵密", en: "dense and rich" }, { zh: "轻盈蓬松", en: "light and airy" }, { zh: "入口即化", en: "melts on the tongue" }];
const textureOf = (id) => { const i = SIGNS.findIndex((s) => s[0] === id); return i < 0 ? null : TEXTURES[i % 4]; };

function setLang(l) {
  lang = l; document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
  $("lang-en").setAttribute("aria-pressed", l === "en"); $("lang-zh").setAttribute("aria-pressed", l === "zh");
  $("note").textContent = t("note"); render();
}
$("lang-en").onclick = () => setLang("en");
$("lang-zh").onclick = () => setLang("zh");

function stopOven() { if (oven) { oven.destroy(); oven = null; } clearTimeout(timer); }
function go(next) { st = next; render(); scrollTo(0, 0); }
function startQuiz() {
  const qs = QUIZ.types[st.type].questions;
  go({ ...st, screen: "q", i: 0, picks: [], writing: false, order: qs.map(() => shuffle([0, 1, 2, 3])) });
}

function render() {
  if (!QUIZ) return;
  stopOven();
  const s = st.screen;
  if (s === "home") {
    app.innerHTML = `<h1 class="fade">${t("title")}</h1><p class="lede">${t("lede")}</p>
      <div class="facts"><span><b>5</b> ${t("f1")}</span><span><b>16</b> ${t("f2")}</span><span><b>64</b> ${t("f3")}</span></div>
      <button class="btn" id="go">${t("start")}</button>`;
    $("go").onclick = () => go({ screen: "mbti" });
  } else if (s === "mbti") {
    app.innerHTML = `<h2>${t("mbtiQ")}</h2><p class="hint">${t("mbtiHint")}</p>
      <div class="mbti">${TYPES.map((x) => `<button data-t="${x}">${x}</button>`).join("")}</div>
      <button class="wide" id="none">${t("noMbti")}</button>`;
    app.querySelectorAll(".mbti button").forEach((b) => (b.onclick = () => go({ screen: "sign", type: b.dataset.t, guessed: false, sign: st.sign })));
    $("none").onclick = () => go({ screen: "guess", g: 0, letters: "", sign: st.sign });
  } else if (s === "guess") {
    const g = GUESS[st.g];
    app.innerHTML = `<div class="progress"><span>${st.g + 1} / ${GUESS.length}</span></div>
      <div class="bar"><i style="width:${(st.g / GUESS.length) * 100}%"></i></div>
      ${st.g === 0 ? `<p class="hint">${t("guessHint")}</p>` : ""}
      <h2 class="fade">${esc(L(g.q))}</h2>
      <div class="stack">${g.a.map(([l, txt]) => `<button class="opt" data-l="${l}">${esc(L(txt))}</button>`).join("")}</div>`;
    app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => {
      const letters = st.letters + b.dataset.l;
      if (letters.length < 4) go({ ...st, g: st.g + 1, letters });
      else go({ screen: "sign", type: letters, guessed: true, sign: st.sign });
    }));
  } else if (s === "sign") {
    app.innerHTML = `<h2>${t("signQ")}</h2><p class="hint">${t("signHint")}</p>
      <div class="signs">${SIGNS.map((x) => `<button data-s="${x[0]}">${lang === "zh" ? x[2] : x[1]}<small>${x[3]}</small></button>`).join("")}</div>
      <button class="wide" id="skip">${t("skip")}</button>`;
    app.querySelectorAll(".signs button").forEach((b) => (b.onclick = () => { st.sign = b.dataset.s; startQuiz(); }));
    $("skip").onclick = () => { st.sign = null; startQuiz(); };
  } else if (s === "q") {
    const qs = QUIZ.types[st.type].questions, q = qs[st.i], n = qs.length, picked = st.picks[st.i], done = picked != null, own = typeof picked === "string";
    app.innerHTML = `<div class="progress"><span>${st.i + 1} / ${n}</span><span></span></div>
      <div class="bar"><i style="width:${(st.i / n) * 100}%"></i></div>
      <h2 class="fade">${esc(L(q.q))}</h2>
      <div class="stack">${st.order[st.i].map((k) => `<button class="opt" data-k="${k}" aria-pressed="${picked === k}" ${done ? "disabled" : ""}>${esc(L(q.options[k]))}</button>`).join("")}
      ${own ? `<button class="opt" aria-pressed="true" disabled>${esc(picked)}</button>`
        : done ? "" : st.writing
          ? `<form class="ownf" id="ownf"><input id="owni" maxlength="60" autocomplete="off" enterkeyhint="done" aria-label="${t("ownPh")}" placeholder="${t("ownPh")}"><button class="btn">${t("ownOk")}</button></form>`
          : `<button class="opt own" id="own">${t("own")}</button>`}</div>
      ${done && q.twist ? `<p class="twist fade" role="status">${esc(L(q.twist))}</p><button class="btn" id="nx">${t("next")}</button>` : ""}`;
    app.querySelectorAll(".opt[data-k]").forEach((b) => (b.onclick = () => choose(+b.dataset.k)));
    if ($("own")) $("own").onclick = () => { st.writing = true; render(); $("owni").focus(); };
    if ($("ownf")) $("ownf").onsubmit = (e) => { e.preventDefault(); const v = $("owni").value.trim().slice(0, 60); if (v) choose(v); };
    if ($("nx")) $("nx").onclick = advance;
  } else if (s === "baking") {
    app.innerHTML = `<div class="oven fade"><div class="dots"><i></i><i></i><i></i></div><h2>${t("baking")}</h2></div>`;
  } else if (s === "result") showResult();
}

// k is an option index, or the sentence the person wrote themselves
function choose(k) {
  if (st.picks[st.i] != null) return;
  st.picks[st.i] = k; st.writing = false;
  const q = QUIZ.types[st.type].questions[st.i];
  render();
  // a twist stays on screen until the reader moves on; other questions flow straight through
  if (!q.twist) timer = setTimeout(advance, typeof k === "string" ? 650 : 420);
}
function advance() {
  clearTimeout(timer);
  if (st.picks[st.i] == null) return;
  st.i++; st.writing = false;
  if (st.i >= QUIZ.types[st.type].questions.length) { st.i--; finish(); return; }
  render(); scrollTo(0, 0);
}

// The branch with the most votes wins; a tie goes to the one voted for most recently.
// Written answers have no branch of their own: the AI places them (ownVotes), or they don't count.
function branchOf(type, picks, ownVotes) {
  const qs = QUIZ.types[type].questions, votes = [0, 0, 0, 0], last = [-1, -1, -1, -1];
  let o = 0;
  picks.forEach((k, i) => {
    const b = typeof k === "string" ? ownVotes[o++] : qs[i].options[k].b;
    if (b >= 0 && b <= 3) { votes[b]++; last[b] = i; }
  });
  const order = [0, 1, 2, 3].sort((x, y) => votes[y] - votes[x] || last[y] - last[x]);
  if (votes[order[0]] === 0) return { best: picks.join("").length % 4, second: -1 };
  return { best: order[0], second: votes[order[1]] > 0 ? order[1] : -1 };
}

async function finish() {
  const ty = QUIZ.types[st.type], sg = signOf(st.sign);
  go({ ...st, screen: "baking" });
  const res = { ownVotes: [], words: null, line: null, lang };
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 7000);
    const r = await fetch("/api/judge", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: ctl.signal,
      body: JSON.stringify({ mbti: st.type, mbti_known: !st.guessed, sign: sg ? sg[1] : null, dessert: L(ty.name), lang,
        branches: ty.branches.map((b) => `${L(b.flavour)} · ${L(b.name)}`),
        picks: ty.questions.map((q, i) => { const k = st.picks[i]; return typeof k === "string" ? { q: L(q.q), a: k, own: true } : { q: L(q.q), a: L(q.options[k]), branch: q.options[k].b }; }) }),
    });
    clearTimeout(to);
    if (r.ok) { const j = await r.json(); if (j.personal_line) res.line = j.personal_line; if (j.core) res.core = j.core; if (j.tension) res.tension = j.tension; if (j.keywords && j.keywords.length >= 3) res.words = j.keywords; if (Array.isArray(j.own_votes)) res.ownVotes = j.own_votes; }
  } catch (e) { /* the card falls back to the branch's own line */ }
  if (st.screen !== "baking") return;
  const bo = branchOf(st.type, st.picks, res.ownVotes); res.branch = bo.best; res.second = bo.second;
  if (!res.words) res.words = ty.questions.map((q, i) => (typeof st.picks[i] === "string" ? st.picks[i].slice(0, 8) : L(q.tag))).concat(L(ty.branches[res.branch].flavour));
  st.result = res; st.shown = false; st.screen = "result"; render();
}

function showResult() {
  const ty = QUIZ.types[st.type], r = st.result, br = ty.branches[r.branch], tx = textureOf(st.sign);
  const ai = r.lang === lang, sec = r.second >= 0 ? ty.branches[r.second] : null;
  const reading = ai && (r.core || r.tension)
    ? `${r.core ? `<p class="callout"><small>${t("drive")}</small>${esc(r.core)}</p>` : ""}${r.tension ? `<p class="callout"><small>${t("pull")}</small>${esc(r.tension)}</p>` : ""}`
    : sec ? `<p class="callout">${esc(t("also")(L(sec.flavour), L(sec.name)))}</p>` : "";
  app.innerHTML = `<div class="card">
      <div id="stage" role="img" aria-label="${esc(L(br.flavour))} ${esc(L(ty.name))}"></div>
      <div class="body" id="rb" hidden>
        <span class="rare">${esc(L(ty.rarity_line))}</span>
        <h2>${esc(L(ty.name))}</h2>
        <div class="chips"><span class="hot">${esc(L(br.flavour))}${lang === "zh" ? t("flavour") : " " + t("flavour")}</span>${tx ? `<span>${esc(L(tx))}</span>` : ""}<span>${esc(L(br.name))}</span></div>
        ${ai && r.line && (r.core || r.tension) ? `${reading}<p class="praise">${esc(r.line)}</p>` : `<p class="praise">${esc(ai && r.line ? r.line : L(br.line))}</p>${reading}`}
      </div></div>
    <div class="stack" id="acts" hidden>
      <button class="btn" id="share">${t("share")}</button>
      <button class="btn ghost" id="again">${t("again")}</button>
      <p class="hint" id="msg" role="status"></p></div>`;
  const reveal = () => { const rb = $("rb"), ac = $("acts"); if (!rb) return; rb.hidden = false; ac.hidden = false; rb.classList.add("fade"); ac.classList.add("fade"); };
  oven = bakeDessert($("stage"), {
    dessert: ty.dessert, palette: br.palette || undefined, words: r.words.slice(0, 7),
    reducedMotion: st.shown, particles: lowEnd ? 9000 : 18000, onDone: reveal,
  });
  st.shown = true;
  $("again").onclick = () => go({ screen: "mbti", sign: st.sign });
  $("share").onclick = async () => {
    const url = location.origin + location.pathname, text = t("shareText")(L(br.flavour), L(ty.name), L(br.name));
    try {
      if (navigator.share) await navigator.share({ title: "Moodessert", text, url });
      else { await navigator.clipboard.writeText(text + " " + url); $("msg").textContent = t("copied"); }
    } catch (e) { if (e && e.name !== "AbortError") $("msg").textContent = t("copyFail"); }
  };
}

fetch("quiz.json").then((r) => r.json()).then((q) => { QUIZ = q; setLang(lang); })
  .catch(() => { app.innerHTML = `<p class="lede">${t("loadFail")}</p>`; });
</script>
</body>
</html>
