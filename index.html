.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;padding-block:16px 4px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}

.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}

.note{font-size:12px;color:var(--muted);text-align:center}

.rare{font-size:13px;color:var(--muted)}

.oven{display:flex;flex-direction:column;align-items:center;gap:16px;padding:64px 0}
.dots{display:flex;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:rise 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes rise{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-8px);opacity:1}}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.dots i{animation:none}.bar i,.opt{transition:none}}
</style>
</head>

function startQuiz() {
  const qs = QUIZ.types[st.type].questions;
  go({ ...st, screen: "q", i: 0, picks: [], writing: false, order: qs.map(() => shuffle([0, 1, 2, 3])) });
}

function render() {
  if (!QUIZ) return;
  stopOven();
  const s = st.screen;
  if (s === "home") {
    app.innerHTML = `<h1 class="fade">${t("title")}</h1><p class="lede">${t("lede")}</p>
      <div class="facts"><span><b>5</b> ${t("f1")}</span><span><b>16</b> ${t("f2")}</span><span><b>64</b> ${t("f3")}</span></div>
      ${friend ? `<p class="callout"><small>${t("invited")}</small>${esc(t("invitedLine")(L(QUIZ.types[friend.type].branches[friend.b].flavour), L(QUIZ.types[friend.type].name)))}</p>` : ""}
      ${friend ? `<button class="btn" id="go">${t("duoGo")}</button><button class="btn ghost" id="solo">${t("soloGo")}</button>`
        : `<button class="btn" id="go">${t("start")}</button>
           ${st.code ? `<form class="ownf" id="codef"><input id="codei" maxlength="2" autocomplete="off" autocapitalize="characters" aria-label="${t("haveCode")}" placeholder="${t("codePh")}"><button class="btn">${t("codeOk")}</button></form><p class="hint" id="codemsg" role="status"></p>`
            : `<button class="wide" id="code">${t("haveCode")}</button>`}`}`;
    $("go").onclick = () => go({ screen: "mbti" });
    if ($("solo")) $("solo").onclick = () => { friend = null; history.replaceState(null, "", location.pathname); go({ screen: "mbti" }); };
    if ($("code")) $("code").onclick = () => { st.code = true; render(); $("codei").focus(); };
    if ($("codef")) $("codef").onsubmit = (e) => { e.preventDefault(); const f = dec($("codei").value); if (f && $("codei").value.trim().length === 2) { friend = f; st.code = false; render(); } else $("codemsg").textContent = t("codeBad"); };
  } else if (s === "duo") {
    showDuo();
  } else if (s === "mbti") {
    app.innerHTML = `<h2>${t("mbtiQ")}</h2><p class="hint">${t("mbtiHint")}</p>
      <div class="mbti">${TYPES.map((x) => `<button data-t="${x}">${x}</button>`).join("")}</div>
      <button class="wide" id="none">${t("noMbti")}</button>`;
    app.querySelectorAll(".mbti button").forEach((b) => (b.onclick = () => go({ screen: "sign", type: b.dataset.t, guessed: false, sign: st.sign })));
    $("none").onclick = () => go({ screen: "guess", g: 0, letters: "", sign: st.sign });
  } else if (s === "guess") {
    const g = GUESS[st.g];
    app.innerHTML = `<div class="progress"><span>${st.g + 1} / ${GUESS.length}</span></div>
      <div class="bar"><i style="width:${(st.g / GUESS.length) * 100}%"></i></div>
      ${st.g === 0 ? `<p class="hint">${t("guessHint")}</p>` : ""}
      <h2 class="fade">${esc(L(g.q))}</h2>
      <div class="stack">${g.a.map(([l, txt]) => `<button class="opt" data-l="${l}">${esc(L(txt))}</button>`).join("")}</div>`;
    app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => {
      const letters = st.letters + b.dataset.l;
      if (letters.length < 4) go({ ...st, g: st.g + 1, letters });
      else go({ screen: "sign", type: letters, guessed: true, sign: st.sign });
    }));
  } else if (s === "sign") {
    app.innerHTML = `<h2>${t("signQ")}</h2><p class="hint">${t("signHint")}</p>
      <div class="signs">${SIGNS.map((x) => `<button data-s="${x[0]}">${lang === "zh" ? x[2] : x[1]}<small>${x[3]}</small></button>`).join("")}</div>
      <button class="wide" id="skip">${t("skip")}</button>`;
    app.querySelectorAll(".signs button").forEach((b) => (b.onclick = () => { st.sign = b.dataset.s; startQuiz(); }));
    $("skip").onclick = () => { st.sign = null; startQuiz(); };
  } else if (s === "q") {
    const qs = QUIZ.types[st.type].questions, q = qs[st.i], n = qs.length, picked = st.picks[st.i], done = picked != null, own = typeof picked === "string";
    app.innerHTML = `<div class="progress"><span>${st.i + 1} / ${n}</span><span></span></div>
      <div class="bar"><i style="width:${(st.i / n) * 100}%"></i></div>
      <h2 class="fade">${esc(L(q.q))}</h2>
      <div class="stack">${st.order[st.i].map((k) => `<button class="opt" data-k="${k}" aria-pressed="${picked === k}" ${done ? "disabled" : ""}>${esc(L(q.options[k]))}</button>`).join("")}
      ${own ? `<button class="opt" aria-pressed="true" disabled>${esc(picked)}</button>`
        : done ? "" : st.writing
          ? `<form class="ownf" id="ownf"><input id="owni" maxlength="60" autocomplete="off" enterkeyhint="done" aria-label="${t("ownPh")}" placeholder="${t("ownPh")}"><button class="btn">${t("ownOk")}</button></form>`
          : `<button class="opt own" id="own">${t("own")}</button>`}</div>
      ${done && q.twist ? `<p class="twist fade" role="status">${esc(L(q.twist))}</p><button class="btn" id="nx">${t("next")}</button>` : ""}`;
    app.querySelectorAll(".opt[data-k]").forEach((b) => (b.onclick = () => choose(+b.dataset.k)));
    if ($("own")) $("own").onclick = () => { st.writing = true; render(); $("owni").focus(); };
    if ($("ownf")) $("ownf").onsubmit = (e) => { e.preventDefault(); const v = $("owni").value.trim().slice(0, 60); if (v) choose(v); };
    if ($("nx")) $("nx").onclick = advance;
  } else if (s === "baking") {
    app.innerHTML = `<div class="oven fade"><div class="dots"><i></i><i></i><i></i></div><h2>${t("baking")}</h2></div>`;
  } else if (s === "result") showResult();
}

// k is an option index, or the sentence the person wrote themselves
function choose(k) {
  if (st.picks[st.i] != null) return;
  st.picks[st.i] = k; st.writing = false;
  const q = QUIZ.types[st.type].questions[st.i];
  render();
  // a twist stays on screen until the reader moves on; other questions flow straight through
  if (!q.twist) timer = setTimeout(advance, typeof k === "string" ? 650 : 420);
}
function advance() {
  clearTimeout(timer);
  if (st.picks[st.i] == null) return;
  st.i++; st.writing = false;
  if (st.i >= QUIZ.types[st.type].questions.length) { st.i--; finish(); return; }
  render(); scrollTo(0, 0);
}

// The branch with the most votes wins; a tie goes to the one voted for most recently.
// Written answers have no branch of their own: the AI places them (ownVotes), or they don't count.
function branchOf(type, picks, ownVotes) {
  const qs = QUIZ.types[type].questions, votes = [0, 0, 0, 0], last = [-1, -1, -1, -1];
  let o = 0;
  picks.forEach((k, i) => {
    const b = typeof k === "string" ? ownVotes[o++] : qs[i].options[k].b;
    if (b >= 0 && b <= 3) { votes[b]++; last[b] = i; }
  });
  const order = [0, 1, 2, 3].sort((x, y) => votes[y] - votes[x] || last[y] - last[x]);
  if (votes[order[0]] === 0) return { best: picks.join("").length % 4, second: -1 };
  return { best: order[0], second: votes[order[1]] > 0 ? order[1] : -1 };
}

async function finish() {
  const ty = QUIZ.types[st.type], sg = signOf(st.sign);
  go({ ...st, screen: "baking" });
  const res = { ownVotes: [], words: null, line: null, lang };
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 9500);
    const r = await fetch("/api/judge", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: ctl.signal,
      body: JSON.stringify({ mbti: st.type, mbti_known: !st.guessed, sign: sg ? sg[1] : null, dessert: L(ty.name), nature: L(ty.nature), lang,
        branches: ty.branches.map((b) => `${L(b.flavour)} · ${L(b.name)}`),
        picks: ty.questions.map((q, i) => { const k = st.picks[i]; return typeof k === "string" ? { q: L(q.q), a: k, own: true } : { q: L(q.q), a: L(q.options[k]), branch: q.options[k].b }; }) }),
    });
    clearTimeout(to);
    if (r.ok) { const j = await r.json(); if (j.personal_line) res.line = j.personal_line; if (j.why) res.why = j.why; if (j.core) res.core = j.core; if (j.tension) res.tension = j.tension; if (j.keywords && j.keywords.length >= 3) res.words = j.keywords; if (Array.isArray(j.own_votes)) res.ownVotes = j.own_votes; }
  } catch (e) { /* the card falls back to the branch's own line */ }
  if (st.screen !== "baking") return;
  const bo = branchOf(st.type, st.picks, res.ownVotes); res.branch = bo.best; res.second = bo.second;
  const qs = ty.questions;
  for (let i = st.picks.length - 1; i >= 0; i--) if (typeof st.picks[i] !== "string" && qs[i].options[st.picks[i]].b === res.branch) { res.quoteQ = i; break; }
  if (!res.words) res.words = ty.questions.map((q, i) => (typeof st.picks[i] === "string" ? st.picks[i].slice(0, 8) : L(q.tag))).concat(L(ty.branches[res.branch].flavour));
  st.result = res; st.shown = false; st.screen = "result"; render();
}

function showResult() {
  const ty = QUIZ.types[st.type], r = st.result, br = ty.branches[r.branch], tx = textureOf(st.sign);
  const mt = QUIZ.types[ty.match.type];
  const ai = r.lang === lang, sec = r.second >= 0 ? ty.branches[r.second] : null;
  // "Why this dessert": the AI's sentence, or a template that quotes the answer which decided the flavour
  const short = (x, n) => { const y = String(x).split(/[，,：:。；;]|\. /)[0].trim(); return y.length > n ? y.slice(0, n) + "…" : y; };
  const ownQuote = st.picks.find((k) => typeof k === "string");
  const q0 = r.quoteQ != null ? L(ty.questions[r.quoteQ].options[st.picks[r.quoteQ]]) : ownQuote;
  const why = ai && r.why ? r.why : q0 ? t("whyT")(short(q0, lang === "zh" ? 18 : 60), L(ty.name), L(ty.nature)) : "";
  const reading = ai && (r.core || r.tension)
    ? `${r.core ? `<p class="callout"><small>${t("drive")}</small>${esc(r.core)}</p>` : ""}${r.tension ? `<p class="callout"><small>${t("pull")}</small>${esc(r.tension)}</p>` : ""}`
    : sec ? `<p class="callout">${esc(t("also")(L(sec.flavour), L(sec.name)))}</p>` : "";
  app.innerHTML = `<div class="card">
      <div id="stage" role="img" aria-label="${esc(L(br.flavour))} ${esc(L(ty.name))}"></div>
      <div class="body" id="rb" hidden>
        <span class="rare">${esc(L(ty.rarity_line))}</span>
        <h2>${esc(L(ty.name))}</h2>
        <div class="chips"><span class="hot">${esc(L(br.flavour))}${lang === "zh" ? t("flavour") : " " + t("flavour")}</span>${tx ? `<span>${esc(L(tx))}</span>` : ""}<span>${esc(L(br.name))}</span></div>
        ${why ? `<p class="callout"><small>${t("why")}</small>${esc(why)}</p>` : ""}
        ${ai && r.line && (r.core || r.tension) ? `${reading}<p class="praise">${esc(r.line)}</p>` : `<p class="praise">${esc(ai && r.line ? r.line : L(br.line))}</p>${reading}`}
        ${friend ? pairBlock(friend, { type: st.type, b: r.branch }) : `<div class="match"><small>${t("match")}</small><b>${esc(L(mt.name))}</b><span>${esc(L(ty.match.line))}</span></div>`}
      </div></div>
    <div class="stack" id="acts" hidden>
      <button class="btn" id="share">${esc(friend ? t("sendBack") : t("find")(L(mt.name)))}</button>
      <button class="btn ghost" id="again">${t("again")}</button>
      <p class="hint" id="msg" role="status"></p>
      <p class="hint">${esc(t("myCode")(enc(st.type, r.branch)))}</p></div>`;
  const reveal = () => { const rb = $("rb"), ac = $("acts"); if (!rb) return; rb.hidden = false; ac.hidden = false; rb.classList.add("fade"); ac.classList.add("fade"); };
  oven = bakeDessert($("stage"), {
    dessert: ty.dessert, palette: br.palette || undefined, words: r.words.slice(0, 7),
    reducedMotion: st.shown, particles: lowEnd ? 9000 : 18000, onDone: reveal,
  });
  st.shown = true;
  if (friend) loadPair(friend, { type: st.type, b: r.branch });
  $("again").onclick = () => go({ screen: "mbti", sign: st.sign });
  $("share").onclick = async () => {
    const base = location.origin + location.pathname, me = { type: st.type, b: r.branch };
    const url = friend ? `${base}?a=${enc(friend.type, friend.b)}&b=${enc(me.type, me.b)}` : `${base}?f=${enc(me.type, me.b)}`;
    const text = friend ? t("pairText")(L(drinkOf(friend, me).name)) : t("shareText")(L(br.flavour), L(ty.name), L(br.name), L(mt.name));
    try {
      if (navigator.share) await navigator.share({ title: "Moodessert", text, url });
      else { await navigator.clipboard.writeText(text + " " + url); $("msg").textContent = t("copied"); }
    } catch (e) { if (e && e.name !== "AbortError") $("msg").textContent = t("copyFail"); }
  };
}

// ----- two-person report
const who = (x) => { const ty = QUIZ.types[x.type]; return { ty, br: ty.branches[x.b], label: L(ty.branches[x.b].flavour) + (lang === "zh" ? "" : " ") + L(ty.name) }; };
function pairBlock(a, b) {
  const A = who(a), B = who(b), d = drinkOf(a, b), score = d.score + ((TYPES.indexOf(a.type) + TYPES.indexOf(b.type) + a.b + b.b) % 4);
  return `<div class="pair"><small>${t("us")}</small><b>${esc(A.label)} × ${esc(B.label)}</b>
    <div class="drink"><span>${t("makes")}</span><strong>${esc(L(d.name))}</strong><em>${t("sync")} ${score}%</em></div>
    <p>${esc(L(d.line))}</p><div class="stack" id="pairai"></div></div>`;
}
function showPair(j) {
  const el = $("pairai"); if (!el || !j) return;
  el.innerHTML = [["give", j.give], ["friction", j.friction], ["tip", j.tip]].filter((x) => x[1]).map(([k, v]) => `<p class="callout fade"><small>${t(k)}</small>${esc(v)}</p>`).join("");
}
async function loadPair(a, b) {
  const key = enc(a.type, a.b) + enc(b.type, b.b) + lang;
  if (pairCache[key]) return showPair(pairCache[key]);
  const A = who(a), B = who(b), d = drinkOf(a, b), side = (x, X) => ({ dessert: L(X.ty.name), flavour: L(X.br.flavour), branch: L(X.br.name), line: L(X.br.line), gives_first: gives(x.type) });
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 9500);
    const r = await fetch("/api/judge", { method: "POST", headers: { "Content-Type": "application/json" }, signal: ctl.signal,
      body: JSON.stringify({ mode: "pair", lang, a: side(a, A), b: side(b, B), drink: `${L(d.name)}: ${L(d.line)}` }) });
    clearTimeout(to);
    if (r.ok) { pairCache[key] = await r.json(); showPair(pairCache[key]); }
  } catch (e) { /* the drink line stands on its own */ }
}
function showDuo() {
  const [a, b] = duo, A = who(a), B = who(b);
  app.innerHTML = `<div class="card"><div class="duo"><figure><div id="sa"></div><figcaption>${esc(A.label)}</figcaption></figure><figure><div id="sb"></div><figcaption>${esc(B.label)}</figcaption></figure></div>
      <div class="body">${pairBlock(a, b)}</div></div>
    <div class="stack"><button class="btn" id="me2">${t("me2")}</button></div>`;
  const mk = (id, x, X) => bakeDessert($(id), { dessert: X.ty.dessert, palette: X.br.palette || undefined, words: [], reducedMotion: true, particles: 7000 });
  const o1 = mk("sa", a, A), o2 = mk("sb", b, B);
  oven = { destroy() { o1.destroy(); o2.destroy(); } };
  loadPair(a, b);
  $("me2").onclick = () => { friend = null; history.replaceState(null, "", location.pathname); go({ screen: "home" }); };
}

fetch("quiz.json").then((r) => r.json()).then((q) => { QUIZ = q; if (duo) st = { screen: "duo" }; setLang(lang); })
  .catch(() => { app.innerHTML = `<p class="lede">${t("loadFail")}</p>`; });
</script>
